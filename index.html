<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GG's Movie Search</title>
    <link rel="icon" href="cinema-projector.png">
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Playwrite+NZ:wght@100..400&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Yuyu&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <script src="
    https://cdn.jsdelivr.net/npm/axios@1.19.0/dist/axios.min.js
    "></script>
    <header>
        <h1>GG's Movie Search</h1>
    </header>
    <main>
        <form action="" class="book-form">
            <div class="search-bar">
                <label for="search">Search</label>
                <input type="text" id="search" name="search">
            </div>
        </form>
        <p id="error"></p>
        <div class="info-line" id="movie-list">
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
